<!doctype html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Description | default .Site.Params.description }}">
    <title>{{ .Title }} — {{ .Site.Title }}</title>
    <link rel="stylesheet" href="{{ "css/custom.css" | relURL }}">
  </head>
  <body class="page">
    <header class="site-header">
      <div class="header-inner">
        <a class="site-name" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
      </div>
    </header>
    <nav class="site-nav" aria-label="Navigation principale">
      {{ range .Site.RegularPages.ByWeight }}
        <a href="{{ .RelPermalink }}"{{ if eq .Permalink $.Permalink }} aria-current="page"{{ end }}>{{ .Title }}</a>
      {{ end }}
    </nav>
    <main>
      <article class="content">
        {{ .Content }}
      </article>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <p>Kit gratuit pour les PME suisses · Contenu sous licence CC BY-SA 4.0</p>
      </div>
    </footer>
  </body>
</html>
